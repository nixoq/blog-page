<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

  <!-- Hero Header -->
  <header class="site-hero">
    <div class="hero-frame"></div>

    <!-- Placeholder sides (replace with character art later) -->
    <div class="hero-placeholder">
      <div class="hero-side">character art</div>
      <div class="hero-side">character art</div>
    </div>

    <div class="hero-content">
      <span class="crown">♛</span>
      <h1 class="site-title">{{ site.title }}</h1>
      <p class="site-tagline">{{ site.tagline }}</p>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="site-nav">
    <div class="wrapper">
      <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">
        <span class="nav-icon">⌂</span> Home
      </a>
      <a href="{{ '/translations/' | relative_url }}" class="nav-link {% if page.url contains 'translations' %}active{% endif %}">
        <span class="nav-icon">❧</span> Translations
      </a>
      <a href="{{ '/oshi-log/' | relative_url }}" class="nav-link {% if page.url contains 'oshi-log' %}active{% endif %}">
        <span class="nav-icon">✦</span> Oshi Log
      </a>
<a href="{{ '/about/' | relative_url }}" class="nav-link {% if page.url contains 'about' %}active{% endif %}">
        <span class="nav-icon">⊕</span> About
      </a>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="page-content">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="wrapper">
      <div class="footer-links">
        <a href="#" title="Twitter/X">𝕏</a>
        <a href="#" title="Tumblr">t</a>
        <a href="#" title="Email">✉</a>
      </div>
      <p class="footer-copy">© {{ 'now' | date: "%Y" }} {{ site.title }} · Made with love</p>
    </div>
  </footer>

</body>
</html>
